name: Domain check

on:
  schedule:
    # 06:00 UTC, which is 10:00 in Dubai.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send one sample Slack message instead of running a check'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: domain-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send a test Slack message
        if: ${{ inputs.test_alert }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node src/check.js --test-alert

      - name: Run the check
        id: check
        if: ${{ !inputs.test_alert }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node src/check.js

      - name: Commit the data if anything changed
        if: ${{ !inputs.test_alert }}
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No change in data/, nothing to commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "chore: domain check $(date -u +%Y-%m-%d), ${{ steps.check.outputs.summary }}"
          git push
